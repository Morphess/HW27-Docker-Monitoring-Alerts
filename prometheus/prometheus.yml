global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: hw27-monitoring

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']
  - job_name: node-exporter
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: fedora:9100
  - job_name: cadvisor
    static_configs:
      - targets: ['127.0.0.1:8080']
